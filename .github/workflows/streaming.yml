name: APK Streamings
on:
  push:
    branches: [android-streaming]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Cinema-Streamings-Teste
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publicar APK de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Cinema-Junto-Streamings.apk
          gh release create "streaming-${{ github.run_number }}" Cinema-Junto-Streamings.apk --target "${{ github.sha }}" --prerelease --title "Cinema Junto Streamings - teste ${{ github.run_number }}" --notes "APK experimental com salas, chat e controle de players via MediaSession. Compatibilidade com os streamings depende de teste em aparelhos reais."
