name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Cinema-Junto-Chat-Final.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cinema-Junto-Chat-Final-APK
          path: Cinema-Junto-Chat-Final.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: apks-para-testes
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 3
  interface:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: apks-para-testes
          path: test-apks
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/test-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-interface-android-${{ matrix.api }}
          path: ui-results
          retention-days: 14
  servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
