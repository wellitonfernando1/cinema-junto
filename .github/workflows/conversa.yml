name: Cinema Conversa APK
on:
  push:
    branches: [conversa-independente, fix/chat-split-0.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cinema-conversa-test-signing-v1
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest -Pcompanion=true --no-daemon
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: conversa-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: conversa-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install apks/debug/app-debug.apk
            adb install -g apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class br.com.cinemajunto.CompanionTest#textRoomDoesNotRequireMicrophonePermission br.com.cinemajunto.chatfilme.test/androidx.test.runner.AndroidJUnitRunner > text-only-result.txt
            cat text-only-result.txt
            grep -q 'OK (1 test)' text-only-result.txt
            adb shell pm grant br.com.cinemajunto.chatfilme android.permission.RECORD_AUDIO
            adb shell am instrument -w -r -e class br.com.cinemajunto.CompanionTest#opensWithoutJoiningOrRecording,br.com.cinemajunto.CompanionTest#companionDoesNotDeclareScreenCapture,br.com.cinemajunto.CompanionTest#voiceCanBeCancelledBeforeGrantWithoutChangingAudioMode,br.com.cinemajunto.SplitChatTest br.com.cinemajunto.chatfilme.test/androidx.test.runner.AndroidJUnitRunner > test-result.txt
            cat test-result.txt
            grep -q 'OK (5 tests)' test-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversa-tests-${{ matrix.api }}
          path: |
            text-only-result.txt
            test-result.txt
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: conversa-apks
          path: apks
      - run: cp apks/debug/app-debug.apk Chat-Filme-0.3.apk
      - name: Publish experimental APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "chat-filme-0.3-${{ github.run_number }}" Chat-Filme-0.3.apk --target "${{ github.sha }}" --prerelease --title "Chat Filme 0.3 · configuração simplificada" --notes "Configuração guiada de permissões; chat de texto sem exigir microfone; controles flutuantes ocultos durante o chat; retorno ao filme quando a tarefa do chat não está dividida. A compatibilidade com os apps de streaming no aparelho do usuário ainda precisa de validação."
